services:
  web-dev:
    build: .
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - USE_REDIS=false
    profiles: ["dev"]

  web-prod:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - USE_REDIS=true
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["prod"]

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["prod"]

volumes:
  redis_data:
