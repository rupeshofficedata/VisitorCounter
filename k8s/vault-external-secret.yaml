apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-cred
spec:
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: ghcr-cred
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .server }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: ghcr-cred
        property: username
    - secretKey: password
      remoteRef:
        key: ghcr-cred
        property: password
    - secretKey: server
      remoteRef:
        key: ghcr-cred
        property: server
